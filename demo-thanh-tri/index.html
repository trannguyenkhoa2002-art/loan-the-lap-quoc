<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Loạn Thế Lập Quốc · Ngũ Đại Thập Quốc</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#b7c2a0;font-family:"Segoe UI",system-ui,Roboto,Arial,sans-serif;overflow:hidden;color:#1f2a24;-webkit-user-select:none;user-select:none}
canvas{display:block;width:100vw;height:100vh;touch-action:none;cursor:grab}
.card{background:#f6ecd6f2;border:1px solid #6b4a2e55;border-radius:12px;box-shadow:0 4px 14px #0003}
#top{position:fixed;left:8px;right:8px;top:8px;display:flex;gap:6px;flex-wrap:wrap;align-items:center;pointer-events:none}
#top>*{pointer-events:auto}
.res{padding:6px 10px;font-weight:800;font-size:14px;white-space:nowrap}
.res small{font-weight:600;color:#6a756c;font-size:11px;margin-left:3px}
#era{padding:6px 12px;font-weight:900;background:#8e2f2a;color:#ffe9b8;border-radius:12px;font-size:14px;border:1px solid #e3bd3f}
#top button,.btn{border:1px solid #0002;background:#fffaf2;border-radius:10px;padding:6px 11px;font-weight:800;cursor:pointer;font-size:13px;color:#1f2a24}
#goal{position:fixed;left:8px;top:54px;width:250px;padding:10px 12px;font-size:13px;max-width:calc(100vw - 16px)}
#goal h3{margin:0 0 6px;font-size:14px;cursor:pointer}
#goal ul{list-style:none;margin:0 0 8px;padding:0}
#goal li{padding:2px 0;color:#7b5a3a}
#goal li.ok{color:#2e7d4f}
#goal .cost{font-size:12px;color:#5d665f;margin-bottom:6px}
#up{width:100%;padding:8px;background:#8e2f2a;color:#fff;border:0;border-radius:10px;font-weight:900;font-size:13px;cursor:pointer}
#up:disabled{background:#c9c2b4;color:#8a8478;cursor:not-allowed}
#goal.min ul,#goal.min .cost,#goal.min #up,#goal.min #raid{display:none}
#raid{margin-top:8px;padding:6px 8px;background:#8e2f2a;color:#fff;border-radius:8px;font-weight:800;font-size:12px;display:none}
#bar{position:fixed;left:8px;right:8px;bottom:8px;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none}
#tip{padding:6px 12px;font-size:12px;font-weight:600;max-width:100%;text-align:center;pointer-events:auto}
#build{display:flex;gap:6px;padding:8px;overflow-x:auto;max-width:100%;pointer-events:auto}
.b{flex:0 0 auto;min-width:82px;border:2px solid transparent;background:#f3ead9;border-radius:10px;padding:6px 8px;text-align:center;cursor:pointer;font-size:12px;font-weight:800;color:#1f2a24}
.b .ic{font-size:22px;line-height:1.1;display:block}
.b .co{font-weight:600;font-size:11px;color:#5d665f;display:block;white-space:nowrap}
.b.on{border-color:#c9772b;background:#ffe9c9}
.b.no{opacity:.5}
.b.lock{opacity:.35;filter:grayscale(1)}
#toast{position:fixed;left:50%;top:104px;transform:translateX(-50%);display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none;z-index:5}
.t{padding:8px 14px;background:#1f2a24ee;color:#fff;border-radius:10px;font-weight:700;font-size:13px;animation:fade 3.6s forwards;max-width:90vw;text-align:center}
.t.bad{background:#8e2f2aee}.t.good{background:#2e7d4fee}
@keyframes fade{0%{opacity:0;transform:translateY(-6px)}8%{opacity:1;transform:none}85%{opacity:1}100%{opacity:0}}
#modal{position:fixed;inset:0;background:#0007;display:none;align-items:center;justify-content:center;z-index:9;padding:16px}
#modal .card{padding:22px;max-width:440px;width:100%;text-align:center}
#modal h2{margin:0 0 8px;font-size:22px}
#modal p{margin:6px 0 12px;font-size:14px;line-height:1.5;color:#3d4640}
#modal input{width:100%;padding:10px;border-radius:10px;border:1px solid #0003;font-size:16px;text-align:center;margin-bottom:12px;font-weight:700}
#modal .go{background:#8e2f2a;color:#ffe9b8;border:0;border-radius:10px;padding:10px 20px;font-weight:900;font-size:15px;cursor:pointer}
#tabs{display:flex;gap:6px;pointer-events:auto;flex-wrap:wrap;justify-content:center}
.tab{border:1px solid #6b4a2e55;background:#f6ecd6f2;border-radius:10px;padding:5px 10px;font-weight:800;font-size:12px;cursor:pointer;color:#1f2a24}
.tab.on{background:#8e2f2a;color:#ffe9b8}
#mBox.wide{max-width:600px;text-align:left;max-height:88vh;overflow:auto}
#mBox h4{margin:14px 0 6px;font-size:14px;color:#8e2f2a;border-bottom:1px solid #6b4a2e33;padding-bottom:4px}
#mBox .hint{font-size:12px;margin:0 0 8px;color:#5d665f}
.cl{display:grid;grid-template-columns:92px 1fr 30px;gap:2px 8px;align-items:center;font-size:13px;margin:5px 0}
.cl .cn{font-weight:800}.cl b{text-align:right}.cl small{grid-column:1/4;color:#6a756c;font-size:11px}
.cb{height:9px;background:#0001;border-radius:6px;overflow:hidden}.cb i{display:block;height:100%;background:#c9772b;border-radius:6px}
.of{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:7px 9px;border:1px solid #6b4a2e33;border-radius:10px;margin:5px 0;font-size:13px;background:#fffaf2}
.of small{color:#5d665f}.of.on{border-color:#2e7d4f;background:#eaf5e6}.of.lock{opacity:.5}
.of button{flex:0 0 auto;border:0;border-radius:8px;padding:7px 10px;font-weight:800;cursor:pointer;background:#8e2f2a;color:#ffe9b8}
.of.on button{background:#6a756c;color:#fff}
@media(max-width:640px){#goal{width:200px;font-size:12px}.res{padding:5px 7px;font-size:12px}.b{min-width:70px}}

<canvas id="c"></canvas>
<div id="top">
  <div id="era"></div>

<script>
'use strict';
// ===== Engine: phép chiếu isometric 64×32, nét viền đậm – cùng phong cách demo đồ họa =====
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
let W=0,H=0,DPR=1,s=1.2,ox=0,oy=0,T=0;
const TW=64,TH=32,OUT='#2b3034',N=26;
const P=(x,y,z=0)=>({x:ox+(x-y)*TW/2*s,y:oy+(x+y)*TH/2*s-z*s});
const shade=(hex,k)=>{const n=parseInt(hex.slice(1),16),c=[n>>16,n>>8&255,n&255].map(v=>Math.max(0,Math.min(255,Math.round(k>0?v+(255-v)*k:v*(1+k)))));return'#'+c.map(v=>v.toString(16).padStart(2,'0')).join('')};
let lw=()=>Math.max(.7,s*.75);
const rnd=i=>{const x=Math.sin(i*127.1+31.7)*43758.5453;return x-Math.floor(x)};
function poly(pts,fill,stroke,w=1){ctx.beginPath();ctx.moveTo(pts[0].x,pts[0].y);for(let i=1;i<pts.length;i++)ctx.lineTo(pts[i].x,pts[i].y);ctx.closePath();if(fill){ctx.fillStyle=fill;ctx.fill()}const st=stroke===undefined?OUT:stroke;if(st){ctx.strokeStyle=st;ctx.lineWidth=lw()*w;ctx.lineJoin='round';ctx.stroke()}}
function line(a,b,col,w=1){ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.strokeStyle=col;ctx.lineWidth=lw()*w;ctx.lineCap='round';ctx.stroke()}
function dot(p,r,col,st){ctx.beginPath();ctx.arc(p.x,p.y,r,0,7);ctx.fillStyle=col;ctx.fill();if(st){ctx.strokeStyle=st;ctx.lineWidth=lw()*.6;ctx.stroke()}}
function box(x,y,w,d,z0,h,col,kTop=.12){const z1=z0+h;
  poly([P(x,y+d,z0),P(x+w,y+d,z0),P(x+w,y+d,z1),P(x,y+d,z1)],shade(col,-.1));
  poly([P(x+w,y,z0),P(x+w,y+d,z0),P(x+w,y+d,z1),P(x+w,y,z1)],shade(col,-.28));
  poly([P(x,y,z1),P(x+w,y,z1),P(x+w,y+d,z1),P(x,y+d,z1)],shade(col,kTop));}
function gable(x,y,w,d,z,h,col,wall){const A=P(x,y+d/2,z+h),Bq=P(x+w,y+d/2,z+h),D=P(x,y+d,z),C=P(x+w,y+d,z);
  poly([P(x,y,z),P(x+w,y,z),Bq,A],shade(col,-.3));
  poly([P(x+w,y,z),C,Bq],shade(wall,-.28));
  poly([D,C,Bq,A],col);
  const n=Math.max(3,Math.round(w*9)),c2=shade(col,-.25);for(let i=1;i<n;i++){const u=i/n;line({x:A.x+(Bq.x-A.x)*u,y:A.y+(Bq.y-A.y)*u},{x:D.x+(C.x-D.x)*u,y:D.y+(C.y-D.y)*u},c2,.5)}
  line(D,C,shade(col,.3),1.3);line(A,Bq,shade(col,-.5),2.2)}
function cone(x,y,w,d,z,h,col){const a=P(x+w/2,y+d/2,z+h);
  poly([P(x,y+d,z),P(x+w,y+d,z),a],col);poly([P(x+w,y,z),P(x+w,y+d,z),a],shade(col,-.25));}
function hip(x,y,w,d,z,h,col,o=.1){
  const x0=x-o,y0=y-o,x1=x+w+o,y1=y+d+o,W2=x1-x0,D2=y1-y0,ix=W2*.2,iy=D2*.25,zm=z+h*.36,rx=W2*.3,ym=(y0+y1)/2;
  const A=P(x0,y0,z),Bc=P(x1,y0,z),C=P(x1,y1,z),D=P(x0,y1,z);
  const Ma=P(x0+ix,y0+iy,zm),Mb=P(x1-ix,y0+iy,zm),Mc=P(x1-ix,y1-iy,zm),Md=P(x0+ix,y1-iy,zm);
  const R1=P(x0+rx,ym,z+h),R2=P(x1-rx,ym,z+h),dk=shade(col,-.45);
  poly([A,Bc,Mb,Ma],shade(col,-.4));poly([Ma,Mb,R2,R1],shade(col,-.4));
  poly([Bc,C,Mc,Mb],shade(col,-.16));poly([Mb,Mc,R2],shade(col,-.28));
  poly([D,C,Mc,Md],shade(col,.1));poly([Md,Mc,R2,R1],col);
  const n=Math.max(3,Math.round(W2*9)),m=Math.max(2,Math.round(D2*6)),L=(a,b,u)=>({x:a.x+(b.x-a.x)*u,y:a.y+(b.y-a.y)*u});
  ctx.strokeStyle=shade(col,-.28);ctx.lineWidth=lw()*.5;ctx.beginPath();
  for(let i=1;i<n;i++){const u=i/n,a=L(D,C,u),b=L(Md,Mc,u),c=L(R1,R2,u);ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.lineTo(c.x,c.y)}
  for(let i=1;i<m;i++){const u=i/m,a=L(Bc,C,u),b=L(Mb,Mc,u);ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.lineTo(R2.x,R2.y)}ctx.stroke();
  line(D,C,shade(col,.38),1.5);line(C,Bc,shade(col,.12),1.5);
  line(C,Mc,dk,1.8);line(Mc,R2,dk,1.8);line(D,Md,dk,1.6);line(Md,R1,dk,1.6);line(Bc,Mb,dk,1.4);line(Mb,R2,dk,1.4);
  line(R1,R2,dk,2.8);
  const up=(q,ex,ey)=>{ctx.beginPath();ctx.moveTo(q.x-ex*4*s,q.y-ey*2*s-1*s);ctx.quadraticCurveTo(q.x+ex*1*s,q.y+1*s,q.x+ex*6*s,q.y-6*s);ctx.strokeStyle=OUT;ctx.lineWidth=lw()*2;ctx.lineCap='round';ctx.stroke()};
  up(D,-1,0);up(Bc,1,0);ctx.beginPath();ctx.moveTo(C.x,C.y-3*s);ctx.quadraticCurveTo(C.x,C.y+2*s,C.x,C.y-7*s);ctx.strokeStyle=OUT;ctx.lineWidth=lw()*2;ctx.stroke();
  for(const [q,e] of [[R1,-1],[R2,1]]){ctx.beginPath();ctx.moveTo(q.x,q.y);ctx.quadraticCurveTo(q.x+e*4*s,q.y-1*s,q.x+e*2.5*s,q.y-6*s);ctx.strokeStyle=OUT;ctx.lineWidth=lw()*2;ctx.stroke()}}
function pillars(x,y,w,d,z,h,col='#a63a2a'){for(let i=0;i<=3;i++){line(P(x+w*i/3,y+d,z),P(x+w*i/3,y+d,z+h),col,2)}for(let i=0;i<=2;i++)line(P(x+w,y+d*i/2,z),P(x+w,y+d*i/2,z+h),shade(col,-.2),2)}
function merlons(x,y,w,d,z,col){const m=.2*Math.min(w,d)+.06;for(const [a,b] of [[x,y],[x+w-m,y],[x,y+d-m],[x+w-m,y+d-m]])box(a,b,m,m,z,6,col)}
function flag(x,y,z,h,col){const a=P(x,y,z),b=P(x,y,z+h);line(a,b,OUT,1.4);const wv=Math.sin(T*4+x)*2*s;
  poly([b,{x:b.x+9*s,y:b.y+1*s},{x:b.x+9*s+wv,y:b.y+15*s},{x:b.x+4.5*s+wv,y:b.y+12*s},{x:b.x,y:b.y+15*s}],col)}
function door(x,y,z,w,h,col){poly([P(x,y,z),P(x+w,y,z),P(x+w,y,z+h),P(x,y,z+h)],col,OUT,.7)}
function person(x,y,body,ph,head='#f1c9a5',hat='bun',carry=0,spear=0){const p=P(x,y),st=Math.sin(T*9+ph),b=Math.abs(st)*1.2*s,Y=p.y-b,lg=hat==='futou'||hat==='wing'||hat==='bald';
  ctx.fillStyle='rgba(0,0,0,.15)';ctx.beginPath();ctx.ellipse(p.x,p.y,4.5*s,2*s,0,0,7);ctx.fill();
  if(!lg){line({x:p.x-1.2*s,y:Y-3*s},{x:p.x-1.2*s-st*1.6*s,y:p.y},'#3a2f28',1.5);line({x:p.x+1.2*s,y:Y-3*s},{x:p.x+1.2*s+st*1.6*s,y:p.y},'#3a2f28',1.5)}
  const bot=lg?Y-.6*s:Y-2.5*s,bw=lg?3.6:3.1;
  poly([{x:p.x-2.2*s,y:Y-10*s},{x:p.x+2.2*s,y:Y-10*s},{x:p.x+bw*s,y:bot},{x:p.x-bw*s,y:bot}],body,OUT,.6);
  line({x:p.x-2.5*s,y:Y-6*s},{x:p.x+2.5*s,y:Y-6*s},hat==='wing'?'#1f1b1a':shade(body,-.45),1);line({x:p.x,y:Y-10*s},{x:p.x-1*s,y:Y-6*s},shade(body,.35),.7);
  if(hat==='helm'){poly([{x:p.x-2.6*s,y:Y-10*s},{x:p.x+2.6*s,y:Y-10*s},{x:p.x+2.2*s,y:Y-6.3*s},{x:p.x-2.2*s,y:Y-6.3*s}],'#8f959b',OUT,.5)}
  if(carry){const a={x:p.x-8*s,y:Y-9.5*s+st*.6*s},c={x:p.x+8*s,y:Y-9.5*s-st*.6*s};line(a,c,'#6b4a2e',1.1);
    for(const q of [a,c]){line(q,{x:q.x,y:q.y+4*s},'#6b4a2e',.6);poly([{x:q.x-2.4*s,y:q.y+4*s},{x:q.x+2.4*s,y:q.y+4*s},{x:q.x+1.6*s,y:q.y+7*s},{x:q.x-1.6*s,y:q.y+7*s}],'#c9a36a',OUT,.5)}}
  if(spear){const a={x:p.x+4.2*s,y:Y},c={x:p.x+4.2*s,y:Y-19*s};line(a,c,'#6b4a2e',1.1);poly([{x:c.x-1.3*s,y:c.y},{x:c.x+1.3*s,y:c.y},{x:c.x,y:c.y-4.5*s}],'#d0d4d8',OUT,.4);dot({x:c.x,y:c.y+1.5*s},1*s,'#c0392b')}
  const hy=Y-12.3*s;dot({x:p.x,y:hy},2.5*s,head,OUT);
  const dome=(c,r)=>{ctx.fillStyle=c;ctx.beginPath();ctx.arc(p.x,hy-.6*s,r*s,3.14,6.29);ctx.closePath();ctx.fill();ctx.strokeStyle=OUT;ctx.lineWidth=lw()*.5;ctx.stroke()};
  if(hat==='non')poly([{x:p.x-5.2*s,y:hy-.7*s},{x:p.x+5.2*s,y:hy-.7*s},{x:p.x,y:hy-5.2*s}],'#e6d28a',OUT,.6);
  else if(hat==='helm'){dome('#9aa0a6',3);line({x:p.x,y:hy-3.6*s},{x:p.x,y:hy-6*s},'#6f757b',1);dot({x:p.x,y:hy-6.2*s},1*s,'#c0392b')}
  else if(hat==='futou'||hat==='wing'){dome('#1f1b1a',2.8);poly([{x:p.x-1.3*s,y:hy-2.8*s},{x:p.x+1.6*s,y:hy-2.8*s},{x:p.x+1.6*s,y:hy-5.2*s},{x:p.x-1.3*s,y:hy-5.2*s}],'#1f1b1a',OUT,.4);
    if(hat==='wing')line({x:p.x-6.5*s,y:hy-1.6*s},{x:p.x+6.5*s,y:hy-1.6*s},'#1f1b1a',1.3);else{line({x:p.x-1.8*s,y:hy-.5*s},{x:p.x-3.4*s,y:hy+4*s},'#1f1b1a',1);line({x:p.x+1.8*s,y:hy-.5*s},{x:p.x+3.4*s,y:hy+4*s},'#1f1b1a',1)}}
  else if(hat==='bun'){ctx.fillStyle='#2b2520';ctx.beginPath();ctx.arc(p.x,hy-.9*s,2.5*s,3.14,6.29);ctx.fill();dot({x:p.x,y:hy-3.3*s},1.2*s,'#2b2520')}}
function horse(x,y,c){const p=P(x,y),b=Math.sin(T*2+x*9)*.7*s;ctx.fillStyle='rgba(0,0,0,.15)';ctx.beginPath();ctx.ellipse(p.x,p.y,8*s,3*s,0,0,7);ctx.fill();
  for(const dx of [-5,-3,3,5])line({x:p.x+dx*s,y:p.y-7*s},{x:p.x+dx*s,y:p.y},shade(c,-.3),1.5);
  ctx.fillStyle=c;ctx.strokeStyle=OUT;ctx.lineWidth=lw()*.6;ctx.beginPath();ctx.ellipse(p.x,p.y-9*s,7*s,3.6*s,0,0,7);ctx.fill();ctx.stroke();
  line({x:p.x+5*s,y:p.y-10*s},{x:p.x+8.5*s,y:p.y-15.5*s+b},OUT,4.4);line({x:p.x+5*s,y:p.y-10*s},{x:p.x+8.5*s,y:p.y-15.5*s+b},c,3.2);
  ctx.beginPath();ctx.ellipse(p.x+10*s,p.y-15.5*s+b,3.2*s,1.9*s,.5,0,7);ctx.fillStyle=c;ctx.fill();ctx.stroke();
  line({x:p.x+5.5*s,y:p.y-12*s},{x:p.x+8*s,y:p.y-16.5*s+b},'#2b2520',1.3);line({x:p.x-7*s,y:p.y-10*s},{x:p.x-9.5*s,y:p.y-5*s},'#2b2520',1.5)}

// ===== Dữ liệu trò chơi =====
const ERAS=['🛖 Thôn trang','🏘️ Trấn','🏯 Thành trì','👑 Vương quốc'];
const RANK=['Hào trưởng','Trấn tướng','Tiết độ sứ','Quốc vương'];
const B={
  road:{n:'Đường đất',i:'🟫',c:{w:1},era:0,cat:0,d:'Sát đường sản xuất +20%. Nối 3 ô để có kỵ mã, 6 ô có xe ngựa, 9 ô có thương đoàn. Giữ và kéo để đắp đường.'},

const CATS=['🏘️ Đường & dân sinh','🌾 Kinh tế','⚔️ Quân sự'];

  {id:'tetuong',n:'Tể tướng (Đồng bình chương sự)',era:3,sal:4,d:'Đứng đầu trăm quan: mọi sản xuất +15%'},

const CLS=[['si','🎓','Sĩ','người đọc sách ở châu học – nguồn để bổ nhiệm quan viên'],['nong','🌾','Nông','làm ruộng, đốn gỗ, đục đá, nấu muối'],['cong','🔨','Công','thợ dệt, thợ gốm, thợ rèn binh khí'],['thuong','💰','Thương','buôn bán ở phường thị, dịch trạm'],['binh','⚔️','Binh','nha binh và kỵ binh'],['tang','🙏','Tăng','sư sãi ở chùa'],['quan','👔','Quan','quan viên đang tại chức'],['luu','🧳','Lưu dân','chưa có việc làm']];
const isBuilt=b=>!b.building;
const isRoad=b=>!!b&&isBuilt(b)&&(b.k==='road'||b.k==='pave');
const isW=(x,y)=>{const q=tile(x,y);return !!(q&&q.b&&isBuilt(q.b)&&(q.b.k==='wall'||q.b.k==='tower'||q.b.k==='gate'))};
const has=id=>!!G.off[id];
const offCount=()=>OFF.reduce((n,o)=>n+(has(o.id)?1:0),0);
const RN={w:'🪵',s:'🪨',f:'🌾',g:'🪙'};
const G={era:0,w:60,s:20,f:40,g:30,pop:4,cap:5,def:0,tick:0,speed:1,tool:null,
  map:[],bl:[],walk:[],raid:null,raidN:0,repel:0,nextRaid:0,fl:[],name:'',off:{},cls:{},cat:0,slots:1,hx:12,hy:12};
window.G=G;
const tile=(x,y)=>x>=0&&y>=0&&x<N&&y<N?G.map[y*N+x]:null;

function gen(){
  for(let i=0;i<N*N;i++)G.map.push({t:'g',b:null,v:rnd(i*3.3)});
  const blob=(cx,cy,r,t,seed)=>{for(let y=-r;y<=r;y++)for(let x=-r;x<=r;x++){const q=tile(cx+x,cy+y);if(q&&Math.hypot(x,y)<r*(.6+.5*rnd(seed+x*7+y*13)))q.t=t}};
  [[4,5,4],[20,4,3],[6,20,4],[21,19,4],[13,2,2],[2,13,2],[23,11,2],[13,23,2]].forEach((b,i)=>blob(b[0],b[1],b[2],'f',i*50));
  [[19,9,2],[7,13,2],[17,21,2],[9,3,2]].forEach((b,i)=>blob(b[0],b[1],b[2],'r',900+i*40));
  blob(17,14,2,'w',2000);
  for(let y=-3;y<=4;y++)for(let x=-3;x<=4;x++){const q=tile(G.hx+x,G.hy+y);if(q)q.t='g'}
  const hall={k:'hall',x:G.hx,y:G.hy};G.bl.push(hall);
  for(let y=0;y<2;y++)for(let x=0;x<2;x++)tile(G.hx+x,G.hy+y).b=hall;
  for(let i=0;i<4;i++)G.walk.push(newWalker(i));
}
function newWalker(i){return{cls:'luu',x:G.hx+2.5,y:G.hy+.5+i*.4,tx:G.hx+2.5,ty:G.hy+1.5,c:['#8a6a4a','#5f7f8f','#a8894e','#6b7f5a','#7a5a6a','#9a8a7a'][i%6],ph:i*1.7}}
const near=(x,y,t,r=2)=>{for(let j=-r;j<=r;j++)for(let i=-r;i<=r;i++){const q=tile(x+i,y+j);if(q&&q.t===t)return true}return false};
const afford=c=>(c.w||0)<=G.w&&(c.s||0)<=G.s&&(c.g||0)<=G.g&&(c.f||0)<=G.f;
const pay=(c,k=1)=>{G.w-=(c.w||0)*k;G.s-=(c.s||0)*k;G.g-=(c.g||0)*k;G.f-=(c.f||0)*k};
const costTxt=c=>Object.keys(c).map(k=>RN[k]+c[k]).join(' ')||'—';
const count=k=>G.bl.reduce((n,b)=>n+(b.k===k&&isBuilt(b)),0);

function canPlace(k,x,y){const q=tile(x,y);if(!q)return'Ngoài bản đồ';
  if(k==='del')return q.b&&q.b.k!=='hall'?'':'Không có gì để phá';
  const d=B[k];if(d.era>G.era)return'Chưa mở khóa – cần lên '+ERAS[d.era];
  if(q.b)return'Ô này đã có công trình';if(q.t!=='g')return'Chỉ xây được trên đất trống';
  if(d.need==='road'){if(![[1,0],[-1,0],[0,1],[0,-1]].some(([i,j])=>{const o=tile(x+i,y+j);return o&&o.b&&(isRoad(o.b)||o.b.k==='gate')}))return'Phải đặt sát đường'}
  else if(d.need&&!near(x,y,d.need))return d.need==='f'?'Phải gần rừng':d.need==='r'?'Phải gần núi đá':'Phải gần nước';
  if(!afford(d.c))return'Thiếu vật liệu: '+costTxt(d.c);return''}
function place(k,x,y){const err=canPlace(k,x,y);if(err){toast(err,'bad');return false}
  const q=tile(x,y);
  if(k==='del'){const b=q.b;pay(B[b.k].c,-.5);G.bl.splice(G.bl.indexOf(b),1);q.b=null;float(x+.5,y+.5,'🔨');recalc();ui();return true}
  pay(B[k].c);const b={k,x,y,on:false,born:T,building:true,progress:0,duration:({road:1.6,pave:2.4,wall:6,farm:7,salt:8,house:14,tower:24,temple:28,gate:22,barracks:22})[k]||16};q.b=b;G.bl.push(b);recalc();ui();return true}

function recalc(){
  let cap=5+G.era*3,def=G.era*3;const c={si:0,nong:0,cong:0,thuong:0,binh:0,tang:0,quan:0,luu:0};
  c.quan=Math.min(offCount(),Math.max(0,G.pop-2));let free=G.pop-c.quan;
  for(const b of G.bl){const d=B[b.k];if(!d)continue;if(!isBuilt(b)){b.on=false;continue}b.on=true;if(b.k==='house')cap+=4;
    if(d.job){b.on=free>=d.job;if(b.on){free-=d.job;c[d.cls]+=d.job}}
    let r=1;for(const [i,j] of [[1,0],[-1,0],[0,1],[0,-1]]){const o=tile(b.x+i,b.y+j);if(o&&o.b&&isBuilt(o.b)){if(o.b.k==='pave'||o.b.k==='gate')r=Math.max(r,1.35);else if(o.b.k==='road')r=Math.max(r,1.2)}}b.rd=r}
  c.luu=free;const on=k=>G.bl.reduce((n,b)=>n+(b.k===k&&b.on?1:0),0),arm=on('armory')>0;
  for(const b of G.bl){if(!isBuilt(b))continue;const k=b.k;if(k==='wall')def+=1;else if(k==='tower')def+=6;else if(k==='gate'||k==='beacon')def+=2;else if(k==='barracks'&&b.on)def+=arm?18:12;else if(k==='stable'&&b.on)def+=10}
  def=Math.floor(def*(1+(has('nguhau')?.15:0)+(has('tuma')?.2:0)+(has('xumat')?.3:0)));
  cap+=on('temple')*6+(has('tham')?8:0)+(has('hanlam')?10:0);
  G.slots=1+on('school')*2;G.cap=cap;G.def=def;G.free=free;G.cls=c;paintTiles()}

function goals(){const e=G.era,rd=count('road')+count('pave'),oc=offCount();
  if(e===0)return{to:1,c:{w:80,s:40},l:[['Dân số ≥ 12',G.pop>=12],['Có 2 ruộng lúa',count('farm')>=2],['Có 1 trại gỗ & 1 mỏ đá',count('lumber')>=1&&count('quarry')>=1],['Đắp 6 ô đường',rd>=6]]};
  if(e===1)return{to:2,c:{w:150,s:150,g:100},l:[['Dân số ≥ 24',G.pop>=24],['Có 1 phường thị',count('market')>=1],['10 đoạn tường thành',count('wall')>=10],['2 vọng lâu',count('tower')>=2],['Bổ nhiệm 2 quan viên',oc>=2]]};
  if(e===2)return{to:3,c:{g:400},l:[['Dân số ≥ 40',G.pop>=40],['Có quân doanh',count('barracks')>=1],['Phòng thủ ≥ 45',G.def>=45],['Thắng 1 trận giữ thành',G.repel>=1],['Bổ nhiệm 4 quan viên',oc>=4]]};
  return null}

function tick(){G.tick++;recalc();
  const some=k=>G.bl.some(b=>b.k===k&&b.on),all=has('tetuong')?1.15:1,ag=all*(has('phan')?1.15:1),ct=all*(1+(has('diem')?.25:0)+(has('tamty')?.3:0)),mk=count('market')>0?1:.5,inn=some('inn')?1.25:1;
  for(const b of G.bl){if(!b.on)continue;const r=b.rd||1,k=b.k;
    if(k==='farm')G.f+=2*r*ag;else if(k==='lumber')G.w+=1.5*r*ag;else if(k==='quarry')G.s+=1*r*ag;
    else if(k==='salt')G.g+=2*r*ag*mk;else if(k==='silk')G.g+=2.5*r*ct*mk;else if(k==='kiln')G.g+=2*r*ct*mk;
    else if(k==='market')G.g+=G.pop*.08*r*ct*inn;else if(k==='barracks')G.g-=1;else if(k==='stable')G.f-=1}
  G.g+=G.pop*.04*(1+(has('thuky')?.2:0)+(has('tamty')?.3:0));
  for(const o of OFF)if(has(o.id))G.g-=o.sal;
  if(G.g<0){G.g=0;if(G.tick%25===0)toast('Kho hết tiền – không đủ trả bổng lộc quan viên và lương lính!','bad')}
  G.f-=G.pop*.25;const gr=(some('temple')||has('hanlam'))?2:3;
  if(G.f<=0){G.f=0;if(G.tick%5===0&&G.pop>2){G.pop--;toast('Đói kém! Dân bỏ đi lưu tán – hãy khai thêm ruộng lúa','bad')}}
  else if(G.tick%gr===0&&G.pop<G.cap&&G.f>10)G.pop++;
  while(G.walk.length<Math.min(G.pop,18))G.walk.push(newWalker(G.walk.length));
  if(G.walk.length>Math.min(G.pop,18))G.walk.length=Math.min(G.pop,18);
  recalc();{const ord=['nong','cong','thuong','binh','si','tang','quan','luu'],n=G.walk.length;G.walk.forEach((w,i)=>{let pos=(i+.5)/n*G.pop,cl='luu';for(const k of ord){if(pos<G.cls[k]){cl=k;break}pos-=G.cls[k]}w.cls=cl})}
  if(G.era>=1){
    if(!G.raid&&G.tick>=G.nextRaid){const str=10+G.raidN*9,side=G.raidN%4,m=[],t0=30+(G.bl.some(b=>b.k==='beacon'&&isBuilt(b))?15:0);
      for(let i=0;i<Math.min(4+G.raidN,10);i++){const u=6+rnd(G.tick+i)*14;m.push(side===0?{x:u,y:.5}:side===1?{x:N-.5,y:u}:side===2?{x:u,y:N-.5}:{x:.5,y:u})}
      m.forEach(r=>{r.sx=r.x;r.sy=r.y});G.raid={t:t0,t0,str,m};
      toast('⚠️ '+foe()+' đang kéo đến! Binh lực '+str+' – phòng thủ của bạn '+G.def,'bad')}
    else if(G.raid){G.raid.t--;if(G.raid.t<=0){const r=G.raid;G.raid=null;G.raidN++;G.nextRaid=G.tick+100;recalc();
      if(G.def>=r.str){G.repel++;G.g+=30+r.str;toast('🛡️ Đại thắng! Đẩy lui quân địch, thu chiến lợi phẩm 🪙'+(30+r.str),'good');float(G.hx+1,G.hy+1,'🛡️')}
      else if(count('granary')>0){G.g*=.8;G.f*=.85;G.w*=.9;toast('💥 Thành bị cướp phá, nhưng nghĩa thương giữ được phần lớn lương tiền. Hãy đắp thêm tường, dựng vọng lâu','bad');float(G.hx+1,G.hy+1,'💥')}
      else{G.g*=.6;G.f*=.6;G.w*=.8;toast('💥 Thành bị cướp phá! Mất 40% tiền & lương thảo. Hãy đắp thêm tường, dựng vọng lâu','bad');float(G.hx+1,G.hy+1,'💥')}}}}
  recalc();ui()}
function appoint(id){const o=OFF.find(q=>q.id===id);if(!o||o.era>G.era)return false;
  if(has(id))delete G.off[id];else{if(offCount()>=G.slots){toast('Không còn sĩ nhân để bổ nhiệm – hãy xây thêm Châu học','bad');return false}G.off[id]=1;toast('📜 Bổ nhiệm '+o.n,'good')}
  recalc();ui();return true}

const foe=()=>G.raidN<2?'Giặc cỏ':G.raidN<4?'Loạn binh':'Quân phiên trấn láng giềng';
function upgrade(){const g=goals();if(!g||!g.l.every(a=>a[1])||!afford(g.c))return;pay(g.c);
  if(g.to===3){modal('<h2>👑 Xưng vương lập quốc</h2><p>Trung Nguyên đổi chủ liên miên, không ai còn đủ sức ràng buộc bạn. Tướng sĩ và bách tính xin bạn lên ngôi, dựng nước một phương.<br>Hãy đặt quốc hiệu:</p><input id="kn" maxlength="24" placeholder="Đặt quốc hiệu của riêng bạn" value="Đại Ninh"><button class="go" id="kg">Đăng quang</button>',()=>{
      document.getElementById('kg').onclick=()=>{G.name=document.getElementById('kn').value.trim()||'Đại Ninh';G.era=3;closeModal();recalc();ui();
        toast('👑 Nước '+G.name+' khai quốc! Bạn đã hoàn thành bản demo.','good');for(let i=0;i<14;i++)float(G.hx+rnd(i)*4-1,G.hy+rnd(i+9)*4-1,['🎉','👑','✨'][i%3])}});return}
  G.era=g.to;if(G.era===1)G.nextRaid=G.tick+70;recalc();ui();
  toast(G.era===1?'🏘️ Thôn trang đã thành Trấn! Bạn được phong Trấn tướng. Mở quan đạo, chùa, châu học, xưởng thợ, tường thành và được bổ nhiệm quan viên ở mục Triều chính. Coi chừng giặc cỏ!':'🏯 Trấn đã thành Thành trì! Bạn nắm quyền Tiết độ sứ. Mở Quân doanh, Xưởng binh khí, Mã phường và thêm chức quan.','good');

    if(d<.05){let alt=null;for(let n=0;n<10;n++){const a=Math.random()*6.28,r=1+Math.random()*2.5,nx=w.x+Math.cos(a)*r,ny=w.y+Math.sin(a)*r,q=tile(nx|0,ny|0);

      if(alt){w.tx=alt[0];w.ty=alt[1]}}
    else{const v=Math.min(d,dt*.8*(G.speed||0));w.x+=dx/d*v;w.y+=dy/d*v}}
  if(G.raid){const k=1-(G.raid.t-acc)/(G.raid.t0||30);for(const r of G.raid.m){r.x=r.sx+(G.hx+1-r.sx)*Math.min(.92,k)+Math.sin(T*2+r.sx)*.1;r.y=r.sy+(G.hy+1-r.sy)*Math.min(.92,k)}}
  for(const f of G.fl)f.t+=dt;G.fl=G.fl.filter(f=>f.t<1.4);
  acc+=dt*G.speed;let n=0;while(acc>=1&&n++<8){acc-=1;tick()}}

  else if(moved<=8&&e.type==='pointerup'){const t=toTile(e.clientX,e.clientY);
    if(G.tool)place(G.tool,t.x,t.y);else{const q=tile(t.x,t.y);if(q&&q.b&&q.b.building){toast(B[q.b.k].n+' đang thi công · '+Math.floor(q.b.progress*100)+'%');return}if(q&&q.b){const k=q.b.k;toast(k==='hall'?ERAS[G.era]+' – phủ của '+RANK[G.era]:B[k].i+' '+B[k].n+(B[k].job&&!q.b.on?' – 💤 thiếu người làm, hãy dựng thêm nhà dân':' – '+B[k].d)+(q.b.rd>1?' · 🛣️ sát đường +'+Math.round((q.b.rd-1)*100)+'%':''))}}}
  if(e.pointerType!=='mouse')hover=null};
cv.addEventListener('pointerup',upF);cv.addEventListener('pointercancel',upF);
cv.addEventListener('wheel',e=>{e.preventDefault();zoom(e.deltaY<0?1.12:.89,e.clientX,e.clientY)},{passive:false});
addEventListener('keydown',e=>{if(e.key==='Escape'){G.tool=null;ui()}});
addEventListener('resize',resize);

// ===== Khởi động =====
gen();resize();{const c=P(G.hx+1,G.hy+1);ox+=W/2-c.x;oy+=H/2-c.y+10}
buildBar();recalc();ui();layout();if(innerWidth<640)$('goal').classList.add('min');requestAnimationFrame(frame);
